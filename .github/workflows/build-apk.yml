name: Build AI Phone Assistant V4 Release APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generate temporary release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/release-keystore.jks" \
            -storepass "AssistantV4BuildOnly" \
            -keypass "AssistantV4BuildOnly" \
            -alias assistant-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=AI Phone Assistant, OU=Mobile, O=AI Phone Assistant, L=Lagos, ST=Lagos, C=NG"
      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE: ../release-keystore.jks
          RELEASE_STORE_PASSWORD: AssistantV4BuildOnly
          RELEASE_KEY_ALIAS: assistant-release
          RELEASE_KEY_PASSWORD: AssistantV4BuildOnly
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: AIPhoneAssistantV4-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
